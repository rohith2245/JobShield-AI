<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JobShield AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>

        body{
            background: #050816;
            overflow-x: hidden;
        }

        .auth-container{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px;
        }

        .auth-card{
            width:450px;
            background: rgba(12,18,40,0.92);
            border:1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius:25px;
            padding:45px;
            box-shadow:0 0 35px rgba(0,140,255,0.25);
            animation: fadeIn 1s ease;
        }

        .logo{
            text-align:center;
            margin-bottom:25px;
        }

        .logo h1{
            color:white;
            font-size:2.4rem;
            font-weight:800;
            letter-spacing:2px;
        }

        .logo span{
            color:#3b82f6;
        }

        .auth-card h2{
            color:white;
            text-align:center;
            margin-bottom:30px;
        }

        .form-group{
            margin-bottom:20px;
        }

        .form-group label{
            color:#d1d5db;
            display:block;
            margin-bottom:8px;
        }

        .form-control{
            width:100%;
            padding:14px;
            border:none;
            outline:none;
            border-radius:12px;
            background:#111827;
            color:white;
            font-size:15px;
            transition:0.3s;
        }

        .form-control:focus{
            border:1px solid #3b82f6;
            box-shadow:0 0 15px rgba(59,130,246,0.5);
        }

        .auth-btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:linear-gradient(90deg,#2563eb,#3b82f6);
            color:white;
            font-weight:700;
            font-size:16px;
            transition:0.3s;
            cursor:pointer;
        }

        .auth-btn:hover{
            transform:translateY(-2px);
            box-shadow:0 0 20px rgba(59,130,246,0.6);
        }

        .bottom-text{
            text-align:center;
            margin-top:20px;
            color:#9ca3af;
        }

        .bottom-text a{
            color:#3b82f6;
            text-decoration:none;
            font-weight:600;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

    </style>

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            <h1>JOB<span>SHIELD</span> AI</h1>
        </div>

        <h2>Login to Continue</h2>

        <form method="POST">

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="auth-btn">
                Login
            </button>

        </form>

        <div class="bottom-text">
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Register
            </a>
        </div>

    </div>

</div>

</body>
</html>
